<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A quick internet speed test for download, upload, latency, and jitter.">
  <title>SpeedtestFast.PRO — Internet speed test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <style>
    :root {
      color-scheme: light;
      font-family: "Inter Tight", Inter, sans-serif;
      color: #111;
      background: #fff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --ink: #111;
      --muted: #858585;
      --line: #e8e8e8;
      --soft: #f5f5f5;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #fff;
    }

    button { font: inherit; }

    .page {
      display: flex;
      flex-direction: column;
      width: min(100% - 64px, 1180px);
      min-height: 100vh;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 84px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.055em;
      text-decoration: none;
    }

    .brand-name span { color: #8c8c8c; }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 22px;
    }

    .brand-mark i {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: var(--ink);
    }

    .brand-mark i:nth-child(1) { height: 8px; }
    .brand-mark i:nth-child(2) { height: 14px; }
    .brand-mark i:nth-child(3) { height: 19px; }
    .brand-mark i:nth-child(4) { height: 11px; }

    .topbar-note {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #666;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--ink);
    }

    main {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      padding: 54px 0 42px;
    }

    .test-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 24px;
      color: #777;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow .status-dot { width: 6px; height: 6px; }

    h1 {
      margin: 0;
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 500;
      letter-spacing: -.055em;
    }

    .reading {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 15px;
      margin: 25px 0 0;
      white-space: nowrap;
    }

    .speed-value {
      display: inline-block;
      min-width: 1.8ch;
      font-size: clamp(112px, 19vw, 192px);
      font-weight: 500;
      letter-spacing: -.105em;
      line-height: .82;
      font-variant-numeric: tabular-nums;
    }
    .reading[data-long="true"] .speed-value {
      font-size: clamp(88px, 15vw, 150px);
    }


    .speed-unit {
      color: #777;
      font-size: clamp(17px, 2.3vw, 22px);
      font-weight: 500;
      letter-spacing: -.04em;
    }

    .measure-label {
      margin: 36px 0 0;
      color: #777;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .16em;
    }

    .control-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 34px;
    }

    .dial {
      --progress: 0;
      position: relative;
      display: grid;
      width: 174px;
      height: 174px;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--ink) calc(var(--progress) * 1%), #eaeaea 0);
    }

    .dial::before {
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: #fff;
      content: "";
    }

    .start-button {
      position: relative;
      display: flex;
      width: 132px;
      height: 132px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .start-button:hover { transform: scale(1.035); }
    .start-button:active { transform: scale(.98); }
    .start-button:focus-visible { outline: 3px solid #858585; outline-offset: 5px; }
    .start-button:disabled { cursor: wait; }

    .button-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
    }

    .button-arrow {
      font-size: 19px;
      font-weight: 400;
      line-height: 1;
    }
    .button-arrow {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
    }

    .button-arrow svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.8;
    }

    .metric-label svg {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      stroke-width: 1.8;
    }


    .run-status {
      min-height: 18px;
      max-width: min(100%, 420px);
      margin: 18px 0 0;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    .run-status[data-state="error"] { color: #111; }
    .run-status[data-state="running"] { color: #444; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-top: 55px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .metric {
      min-height: 99px;
      padding: 20px 24px 19px;
      border-right: 1px solid var(--line);
    }

    .metric:first-child { padding-left: 0; }
    .metric:last-child { padding-right: 0; border-right: 0; }

    .metric-label {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 10px;
      color: #777;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
    }


    .metric-value {
      margin: 0;
      font-size: 21px;
      font-weight: 500;
      letter-spacing: -.045em;
      font-variant-numeric: tabular-nums;
    }

    .metric-unit {
      margin-left: 4px;
      color: #777;
      font-size: 11px;
      letter-spacing: 0;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 0 24px;
      color: #888;
      font-size: 10px;
      line-height: 1.5;
    }

    footer p { margin: 0; }
    .footer-right { white-space: nowrap; }

    @media (max-width: 640px) {
      .page { width: min(100% - 36px, 480px); }
      .topbar { min-height: 70px; }
      .brand { font-size: 17px; }
      .topbar-note { font-size: 9px; letter-spacing: .08em; }
      main { padding: 45px 0 32px; }
      .eyebrow { margin-bottom: 20px; font-size: 9px; }
      .reading { gap: 10px; margin-top: 31px; }
      .speed-value { font-size: clamp(102px, 25vw, 145px); }
      .reading[data-long="true"] .speed-value { font-size: clamp(68px, 21vw, 112px); }
      .speed-unit { font-size: 16px; }
      .control-wrap { margin-top: 31px; }
      .dial { width: 154px; height: 154px; }
      .start-button { width: 116px; height: 116px; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 39px; }
      .metric { min-height: 83px; padding: 16px 15px; }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .metric:first-child { padding-left: 0; }
      .metric:nth-child(3) { padding-left: 0; }
      .metric:nth-child(2) { padding-right: 0; }
      .metric:last-child { padding-right: 0; }
      .metric-value { font-size: 19px; }
      footer { flex-direction: column; gap: 7px; padding-top: 16px; }
      .footer-right { white-space: normal; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#" aria-label="SpeedtestFast.PRO — home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">SpeedtestFast<span>.PRO</span></span>
      </a>
      <div class="topbar-note"><span class="status-dot" aria-hidden="true"></span>INTERNET SPEED TEST</div>
    </header>

    <main>
      <section class="test-stage" aria-labelledby="page-title">
        <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span>CONNECTION CHECK</p>
        <h1 id="page-title">Your internet speed</h1>
        <div class="reading" aria-live="polite" aria-atomic="true">
          <span class="speed-value" id="speedValue">0.0</span>
          <span class="speed-unit">Mbps</span>
        </div>
        <p class="measure-label" id="measureLabel">DOWNLOAD SPEED</p>
        <div class="control-wrap">
          <div class="dial" id="dial" aria-hidden="true">
            <button class="start-button" id="startButton" type="button" aria-label="Start speed test">
              <span class="button-label" id="buttonLabel">START</span>
              <span class="button-arrow" id="buttonArrow" aria-hidden="true"><i data-lucide="arrow-up-right"></i></span>
            </button>
          </div>
          <p class="run-status" id="runStatus" role="status" aria-live="polite">Click to test your connection speed</p>
        </div>
      </section>

      <section class="metrics" aria-label="Test results">
        <div class="metric">
          <p class="metric-label"><i data-lucide="download" aria-hidden="true"></i>Download</p>
          <p class="metric-value"><span id="downloadValue">—</span><span class="metric-unit">Mbps</span></p>
        </div>
        <div class="metric">
          <p class="metric-label"><i data-lucide="upload" aria-hidden="true"></i>Upload</p>
          <p class="metric-value"><span id="uploadValue">—</span><span class="metric-unit">Mbps</span></p>
        </div>
        <div class="metric">
          <p class="metric-label"><i data-lucide="activity" aria-hidden="true"></i>Latency</p>
          <p class="metric-value"><span id="pingValue">—</span><span class="metric-unit">ms</span></p>
        </div>
        <div class="metric">
          <p class="metric-label"><i data-lucide="move-vertical" aria-hidden="true"></i>Jitter</p>
          <p class="metric-value"><span id="jitterValue">—</span><span class="metric-unit">ms</span></p>
        </div>
      </section>
    </main>

    <footer>
      <p class="footer-right">Results depend on your network, device, and current network load.</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    (() => {
      const TEST_HOST = "https://cdnrrtcrwqtgkafu6ulm.svc.cdn.yandex.net";
      const TEST_WS_HOST = TEST_HOST.replace(/^https:/, "wss:");
      const speedValue = document.getElementById("speedValue");
      const reading = document.querySelector(".reading");
      const measureLabel = document.getElementById("measureLabel");
      const runStatus = document.getElementById("runStatus");
      const startButton = document.getElementById("startButton");
      const buttonLabel = document.getElementById("buttonLabel");
      const buttonArrow = document.getElementById("buttonArrow");
      const dial = document.getElementById("dial");
      const downloadValue = document.getElementById("downloadValue");
      const uploadValue = document.getElementById("uploadValue");
      const pingValue = document.getElementById("pingValue");
      const jitterValue = document.getElementById("jitterValue");
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const speedNumber = { value: 0 };
      const progressNumber = { value: 0 };
      let activeController = null;
      let currentMid = "";

      const format = (value, digits = 1) => new Intl.NumberFormat("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }).format(value);
      function canAnimate() {
        return Boolean(window.gsap && !prefersReducedMotion && !document.hidden);
      }

      function setStatus(message, state = "ready") {
        runStatus.textContent = message;
        runStatus.dataset.state = state;
        if (canAnimate()) {
          window.gsap.fromTo(runStatus, { y: 5 }, {
            y: 0,
            duration: 0.35,
            ease: "power2.out",
            overwrite: true
          });
        }
      }

      function setProgress(value, animate = true) {
        const target = Math.max(0, Math.min(100, value));
        if (canAnimate() && animate) {
          window.gsap.killTweensOf(progressNumber);
          window.gsap.to(progressNumber, {
            value: target,
            duration: 0.55,
            ease: "power3.out",
            onUpdate: () => dial.style.setProperty("--progress", progressNumber.value.toFixed(2))
          });
          return;
        }
        if (window.gsap) window.gsap.killTweensOf(progressNumber);
        progressNumber.value = target;
        dial.style.setProperty("--progress", String(target));
      }

      function setSpeed(value, animate = true) {
        const target = Math.max(0, Number(value) || 0);
        const render = () => {
          const formatted = format(speedNumber.value);
          speedValue.textContent = formatted;
          reading.dataset.long = String(formatted.length > 4);
        };
        if (canAnimate() && animate) {
          window.gsap.killTweensOf(speedNumber);
          window.gsap.to(speedNumber, {
            value: target,
            duration: 0.24,
            ease: "power2.out",
            onUpdate: render
          });
          return;
        }
        if (window.gsap) window.gsap.killTweensOf(speedNumber);
        speedNumber.value = target;
        render();
      }
      function buildTestUrl(path, params = {}) {
        const url = new URL(path, TEST_HOST);
        url.searchParams.set("mid", currentMid);
        for (const [key, value] of Object.entries(params)) url.searchParams.set(key, String(value));
        return url.href;
      }

      function setButtonIcon(name) {
        if (!window.lucide) {
          buttonArrow.textContent = name === "square" ? "■" : "↗";
          return;
        }
        const icon = document.createElement("i");
        icon.setAttribute("data-lucide", name);
        buttonArrow.replaceChildren(icon);
        window.lucide.createIcons({ attrs: { "aria-hidden": "true", "stroke-width": 1.8 } });
      }

      function animateEntrance() {
        if (!canAnimate()) return;
        const entrance = window.gsap.timeline({ defaults: { ease: "power3.out" } });
        entrance
          .from(".topbar", { y: -12, duration: 0.65 })
          .from(".eyebrow, #page-title, .reading, .measure-label, .control-wrap", {
            y: 18,
            duration: 0.62,
            stagger: 0.075
          }, "-=0.34")
          .from(".metric", { y: 13, duration: 0.5, stagger: 0.07 }, "-=0.25")
          .from("footer p", { y: 6, duration: 0.4, stagger: 0.08 }, "-=0.16");
      }

      function makePhase(parentSignal, timeoutMs) {
        const controller = new AbortController();
        const abortFromParent = () => controller.abort();
        if (parentSignal.aborted) controller.abort();
        else parentSignal.addEventListener("abort", abortFromParent, { once: true });
        const timer = window.setTimeout(() => controller.abort(), timeoutMs);
        return {
          signal: controller.signal,
          cleanup() {
            window.clearTimeout(timer);
            parentSignal.removeEventListener("abort", abortFromParent);
          }
        };
      }

      function throwIfCancelled(signal) {
        if (signal.aborted) throw new DOMException("Test stopped", "AbortError");
      }

      async function measureLatency(signal) {
        const samples = [];
        for (let i = 0; i < 6; i += 1) {
          throwIfCancelled(signal);
          const started = performance.now();
          const response = await fetch(buildTestUrl("/ping", { t: `${Date.now()}-${i}` }), {
            cache: "no-store",
            signal
          });
          if (!response.ok) throw new Error("Unable to check connection latency.");
          await response.arrayBuffer();
          if (i > 0) samples.push(performance.now() - started);
        }
        const ping = Math.min(...samples);
        const jitter = samples.slice(1).reduce((sum, sample, index) => sum + Math.abs(sample - samples[index]), 0) / (samples.length - 1);
        return { ping, jitter };
      }

      async function measureDownload(parentSignal) {
        const phase = makePhase(parentSignal, 4000);
        const started = performance.now();
        let received = 0;
        let failure = null;

        const workers = Array.from({ length: 3 }, async (_, index) => {
          try {
            const response = await fetch(buildTestUrl("/probes/50mb", { t: `${Date.now()}-${index}` }), {
              cache: "no-store",
              signal: phase.signal
            });
            if (!response.ok || !response.body) throw new Error("Unable to load test data.");
            const reader = response.body.getReader();
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              received += value.byteLength;
              const elapsed = Math.max((performance.now() - started) / 1000, 0.05);
              setSpeed(received * 8 / elapsed / 1_000_000, false);
              setProgress(12 + Math.min(64, elapsed / 4 * 64), false);
            }
          } catch (error) {
            if (!phase.signal.aborted) failure ??= error;
          }
        });

        await Promise.all(workers);
        const elapsed = Math.max((performance.now() - started) / 1000, 0.05);
        phase.cleanup();
        throwIfCancelled(parentSignal);
        if (failure) throw failure;
        if (received === 0) throw new Error("Unable to receive test data.");
        return received * 8 / elapsed / 1_000_000;
      }


      async function measureUpload(parentSignal) {
        const durationMs = 3500;
        const phase = makePhase(parentSignal, durationMs + 4500);
        const url = new URL("/upload-ws", TEST_WS_HOST);
        url.searchParams.set("mid", currentMid);
        url.searchParams.set("type", "upload");
        url.searchParams.set("duration", String(Math.ceil(durationMs / 1000)));

        return new Promise((resolve, reject) => {
          let socket;
          let started = 0;
          let acknowledged = 0;
          let pumpTimer;
          let settled = false;
          const chunk = new ArrayBuffer(65_536);

          const cleanup = () => {
            clearTimeout(pumpTimer);
            phase.signal.removeEventListener("abort", stopSocket);
            phase.cleanup();
          };

          const finish = error => {
            if (settled) return;
            settled = true;
            const elapsed = Math.max((performance.now() - started) / 1000, 0.05);
            cleanup();
            if (parentSignal.aborted) {
              reject(new DOMException("Test stopped", "AbortError"));
            } else if (acknowledged === 0) {
              reject(error || new Error("Unable to measure upload speed."));
            } else {
              resolve(acknowledged * 8 / elapsed / 1_000_000);
            }
          };

          const stopSocket = () => {
            clearTimeout(pumpTimer);
            if (socket && socket.readyState < WebSocket.CLOSING) socket.close();
          };

          const pump = () => {
            if (socket.readyState !== WebSocket.OPEN) return;
            while (socket.bufferedAmount + chunk.byteLength <= 1_048_576 && socket.readyState === WebSocket.OPEN) {
              socket.send(chunk);
            }
            pumpTimer = window.setTimeout(pump, 1);
          };

          try {
            socket = new WebSocket(url.href);
          } catch (error) {
            phase.cleanup();
            reject(error);
            return;
          }

          phase.signal.addEventListener("abort", stopSocket, { once: true });
          socket.onopen = () => {
            started = performance.now();
            pump();
          };
          socket.onmessage = event => {
            try {
              const message = JSON.parse(event.data);
              if (message.k !== "u" || !Number.isFinite(message.b)) return;
              acknowledged += message.b;
              const elapsed = Math.max((performance.now() - started) / 1000, 0.05);
              setSpeed(acknowledged * 8 / elapsed / 1_000_000);
              setProgress(80 + Math.min(18, elapsed / (durationMs / 1000) * 18), false);
            } catch {
              // Ignore non-metric websocket messages.
            }
          };
          socket.onerror = () => {
            stopSocket();
            finish(new Error("Unable to connect to the upload server."));
          };
          socket.onclose = () => finish();
        });
      }

      async function runTest() {
        if (activeController) {
          activeController.abort();
          return;
        }

        const controller = new AbortController();
        activeController = controller;
        currentMid = `speedtestfast-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
        startButton.setAttribute("aria-label", "Stop speed test");
        buttonLabel.textContent = "STOP";
        setButtonIcon("square");
        if (canAnimate()) {
          window.gsap.fromTo(startButton, { scale: 0.94 }, {
            scale: 1,
            duration: 0.45,
            ease: "back.out(2)",
            overwrite: "auto"
          });
        }
        setProgress(4);
        setStatus("Measuring latency…", "running");

        try {
          const latency = await measureLatency(controller.signal);
          pingValue.textContent = format(latency.ping, 0);
          jitterValue.textContent = format(latency.jitter, 1);
          setProgress(10);

          measureLabel.textContent = "DOWNLOAD SPEED";
          setStatus("Measuring download speed…", "running");
          const download = await measureDownload(controller.signal);
          downloadValue.textContent = format(download);
          setSpeed(download);
          setProgress(78);

          setStatus("Measuring upload speed…", "running");
          const upload = await measureUpload(controller.signal);
          uploadValue.textContent = format(upload);
          setSpeed(download, false);
          measureLabel.textContent = "DOWNLOAD SPEED";
          setProgress(100, false);
          setStatus("Test complete", "complete");
        } catch (error) {
          if (controller.signal.aborted) {
            setStatus("Test stopped", "ready");
          } else {
            setStatus("Test failed. Check your internet connection and try again.", "error");
          }
          setProgress(0);
        } finally {
          activeController = null;
          startButton.setAttribute("aria-label", "Start speed test");
          buttonLabel.textContent = "TEST AGAIN";
          setButtonIcon("arrow-up-right");
        }
      }

      if (window.lucide) {
        window.lucide.createIcons({ attrs: { "aria-hidden": "true", "stroke-width": 1.8 } });
      } else {
        buttonArrow.textContent = "↗";
      }
      animateEntrance();
      startButton.addEventListener("click", runTest);
    })();
  </script>
</body>
</html>
